services:
  app:
    build: .
    container_name: aetherops-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://aetherops.labshub.cc}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
