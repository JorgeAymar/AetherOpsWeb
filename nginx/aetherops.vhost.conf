# This mirrors the ACTUAL file deployed at /etc/nginx/sites-enabled/aetherops.labshub.cc
# on the shared VPS (217.216.49.191), which hosts ~50 other sites behind one nginx and
# Certbot. It is NOT a standalone nginx+TLS setup — don't `nginx -t`/reload this file in
# isolation elsewhere, and don't replace the live file wholesale: only merge in changes,
# preserving the "# managed by Certbot" blocks (certbot's renewal hooks look for them),
# and run `nginx -t` on the real box before reloading. The app itself listens on
# 127.0.0.1:8097 (see docker-compose.yml's HOST_PORT), assigned from this VPS's 80xx/81xx
# port range. Global box-wide config (not duplicated here) already provides: Cloudflare
# real-IP trust (conf.d/cloudflare-realip.conf), server_tokens off, and a baseline set of
# security headers (nginx.conf) that the app's own (stricter) headers layer on top of.
limit_req_zone $binary_remote_addr zone=aetherops_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aetherops_form:10m rate=5r/m;

server {
    server_name aetherops.labshub.cc;

    # Added: this app only needs a small JSON body, and no reason to run
    # longer than a few seconds for a slow client (global default is 2000M)
    client_max_body_size 100k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;

    # Added: anti-spam limit on the public demo-request form, POST only
    location = /api/demo-request {
        limit_req zone=aetherops_form burst=3 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Added: general limit for the rest of the API
    location /api/ {
        limit_req zone=aetherops_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aetherops.labshub.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aetherops.labshub.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = aetherops.labshub.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name aetherops.labshub.cc;
    return 404; # managed by Certbot


}
